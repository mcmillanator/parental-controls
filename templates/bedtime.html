<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedtime Settings — Bazzite</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            padding: 2rem;
        }
        h1 {
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        .subtitle {
            color: #888;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        button {
            padding: 0.4rem 1rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: opacity 0.15s;
        }
        button:hover { opacity: 0.85; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-unlock { background: #4ecca3; color: #1a1a2e; }
        h2 { margin: 2rem 0 0.75rem; font-size: 1.3rem; }
        .bedtime-card {
            background: #16213e;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }
        .bedtime-card h3 { margin-bottom: 0.75rem; font-size: 1rem; }
        .bedtime-card label { font-size: 0.85rem; color: #aaa; margin-right: 0.35rem; }
        .bedtime-card input[type="time"] {
            background: #1a1a2e;
            color: #e0e0e0;
            border: 1px solid #0f3460;
            border-radius: 4px;
            padding: 0.3rem 0.5rem;
            margin-right: 1rem;
        }
        .days-row { margin: 0.75rem 0; }
        .days-row label { margin-right: 0.75rem; color: #ccc; }
        .btn-save { background: #0f8b8d; color: #fff; margin-top: 0.5rem; }
        #toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            padding: 0.75rem 1.25rem;
            border-radius: 6px;
            font-size: 0.9rem;
            display: none;
            z-index: 100;
        }
        .toast-success { background: #4ecca3; color: #1a1a2e; }
        .toast-error { background: #e94560; color: #fff; }
    </style>
</head>
<body>
    <h1>Bedtime Settings</h1>
    <p class="subtitle">Configure scheduled bedtime lock windows for each user</p>
    <p class="nav-links"><a href="/" style="color: #4ecca3;">← Back to Main Page</a></p>

    <h2>Users</h2>
    {% for user in users %}
    <div class="bedtime-card">
        <h3>{{ user.username }}</h3>
        <form class="bedtime-form" data-username="{{ user.username }}" onsubmit="return saveBedtime('{{ user.username }}', event)">
            <label for="start-{{ user.username }}">From</label>
            <input type="time" id="start-{{ user.username }}" name="start" value="{{ user.bedtime.start if user.bedtime else '' }}">
            <label for="end-{{ user.username }}">To</label>
            <input type="time" id="end-{{ user.username }}" name="end" value="{{ user.bedtime.end if user.bedtime else '' }}">
            <div class="days-row">
                {% for label in day_labels %}
                <label><input type="checkbox" name="days" value="{{ loop.index0 }}" {% if user.bedtime and loop.index0 in user.bedtime.days %}checked{% endif %}> {{ label }}</label>
                {% endfor %}
            </div>
            <button type="submit" class="btn-save">Save</button>
            <button type="button" class="btn-unlock" onclick="clearBedtime('{{ user.username }}')">Clear</button>
        </form>
    </div>
    {% endfor %}

    <div id="toast"></div>

    <script>
        function showToast(msg, isError) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = isError ? 'toast-error' : 'toast-success';
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        let bedtimeDirty = false;
        document.addEventListener('input', function (e) {
            if (e.target.closest('.bedtime-form')) bedtimeDirty = true;
        });
        document.addEventListener('change', function (e) {
            if (e.target.closest('.bedtime-form')) bedtimeDirty = true;
        });

        async function saveBedtime(username, event) {
            event.preventDefault();
            const form = event.target;
            const start = form.querySelector('input[name="start"]').value;
            const end = form.querySelector('input[name="end"]').value;
            const days = Array.from(form.querySelectorAll('input[name="days"]:checked')).map(cb => cb.value);
            if (!start || !end || days.length === 0) {
                showToast('Set start, end, and at least one day (or use Clear)', true);
                return false;
            }
            try {
                const body = `username=${encodeURIComponent(username)}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}` +
                    days.map(d => `&days=${encodeURIComponent(d)}`).join('');
                const resp = await fetch('/api/bedtime', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body
                });
                const data = await resp.json();
                if (data.success) {
                    bedtimeDirty = false;
                    showToast(`Bedtime saved for ${username}`, false);
                    setTimeout(() => location.reload(), 800);
                } else {
                    showToast(`Error: ${data.error || data.message}`, true);
                }
            } catch (e) {
                showToast(`Error: ${e.message}`, true);
            }
            return false;
        }

        async function clearBedtime(username) {
            if (!confirm(`Clear bedtime for "${username}"?`)) return;
            try {
                const resp = await fetch('/api/bedtime', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `username=${encodeURIComponent(username)}`
                });
                const data = await resp.json();
                if (data.success) {
                    bedtimeDirty = false;
                    showToast(`Bedtime cleared for ${username}`, false);
                    setTimeout(() => location.reload(), 800);
                } else {
                    showToast(`Error: ${data.error || data.message}`, true);
                }
            } catch (e) {
                showToast(`Error: ${e.message}`, true);
            }
        }
    </script>
</body>
</html>
